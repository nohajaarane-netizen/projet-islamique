version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nour-postgres
    environment:
      POSTGRES_USER: nour_user
      POSTGRES_PASSWORD: nour_password
      POSTGRES_DB: nour_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nour_user -d nour_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nour-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: nour-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nour-network

  # NOUR Backend API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nour-app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://nour_user:nour_password@postgres:5432/nour_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - nour-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  nour-network:
    driver: bridge
